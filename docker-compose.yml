services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: passwire
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_NAME: Passwire
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8080"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
    volumes:
      - passwire_data:/var/www/html/database
      - passwire_storage:/var/www/html/storage

volumes:
  passwire_data:
  passwire_storage:
