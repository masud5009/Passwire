  <rect x="2" y="2" width="40" height="40" rx="10" fill="url(#bg-glow)" opacity="0.15"/>
  
  <!-- Lightning bolt -->
  <path d="M24 8L13 22H21L18 34L30 19H22L24 8Z" fill="url(#bolt-grad)" stroke="#34d399" stroke-width="1.2" stroke-linejoin="round"/>
  
  <!-- Brand text -->
  <text x="52" y="28" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="-0.03em">Pass<tspan fill="#34d399">wire</tspan></text>
  
  <!-- Subtle subtitle/badge -->
  <rect x="146" y="16" width="48" height="15" rx="4" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.25" stroke-width="1"/>
  <text x="151" y="27" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#34d399" letter-spacing="0.05em">GATEWAY</text>

  <defs>
